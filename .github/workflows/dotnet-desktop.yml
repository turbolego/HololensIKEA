# Builds a signed Release .msix (sideload) and uploads it as a workflow artifact.
# Runs on every push to master (not on pull-requests).
# No secrets required: a fresh self-signed certificate is generated per run.
# For Store submission see dotnet.yml.
#
# To sideload: download the artifact and deploy via WinAppDeployCmd or Device Portal.
#
# On manual trigger with action=submit:
# - Auto-increments Package.appxmanifest Identity Version (4th segment stays 0)
# - Builds sideload-compatible .msix
# - Commits version bump back to repo
# - Creates GitHub release with .msix attached

name: UWP Package

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Package action'
        required: true
        default: 'package'
        type: choice
        options:
          - package      # Build + upload artifact only
          - submit       # Build + auto-increment version + commit + create GitHub release

jobs:
  package:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: NuGet restore
        run: nuget restore HololensIKEA.csproj

      - name: Install Windows 10 SDK 19041 and UWP MSBuild tools
        shell: powershell
        run: |
          $vswhere   = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath    = & $vswhere -latest -products * -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify `
            --installPath "$vsPath" `
            --add Microsoft.VisualStudio.Component.Windows10SDK.19041 `
            --add Microsoft.VisualStudio.ComponentGroup.UWP.MSBuild `
            --quiet --norestart --force
          if ($LASTEXITCODE -notin @(0, 3010)) { exit $LASTEXITCODE }

      - name: Build UWP x86 Draco decoder
        shell: pwsh
        run: .\.github\scripts\build-draco-uwp.ps1

      # Generate a throw-away self-signed cert for this run.
      # The password "ci" overrides the <PackageCertificatePassword> in the .csproj.
      - name: Create signing certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=BB1A7F2A-A87C-44C8-8C14-84C6486E7E75" `
            -KeyUsage DigitalSignature `
            -FriendlyName "HololensIKEA" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "ci" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert `
            -FilePath "${{ github.workspace }}\HololensIKEA_TemporaryKey.pfx" `
            -Password $pwd

      # Auto-increment package version (submit runs only)
      # Microsoft Store requires the 4th segment (revision) to be 0.
      # The bump is applied to the working tree BEFORE the build so the
      # package carries the new version; it is committed back to the repo
      # after a successful run (see 'Commit version bump').
      - name: Auto-increment package version
        if: github.event.inputs.action == 'submit'
        shell: pwsh
        run: |
          $manifestPath = "${{ github.workspace }}\Package.appxmanifest"
          $manifest = [xml](Get-Content $manifestPath)
          $current = [Version]$manifest.Package.Identity.Version
          $next = "{0}.{1}.{2}.0" -f $current.Major, $current.Minor, ($current.Build + 1)
          $manifest.Package.Identity.Version = $next
          $manifest.Save($manifestPath)
          "NEXT_VERSION=$next" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Bumped package version: $($current.ToString()) -> $next"

      - name: Validate manifest version format
        if: github.event.inputs.action == 'submit'
        shell: pwsh
        run: |
          $manifest = [xml](Get-Content "${{ github.workspace }}\Package.appxmanifest")
          $version = [Version]$manifest.Package.Identity.Version
          if ($version.Revision -ne 0) {
            Write-Error "Package.appxmanifest Identity Version '$version' is invalid. The 4th segment (revision) must be 0."
          }
          Write-Host "Validated package version: $version"

      - name: Build and package Release x86 sideload
        run: >
          msbuild HololensIKEA.csproj
          /t:Publish
          /p:Configuration=Release
          /p:Platform=x86
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageDir=AppPackages\
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile=${{ github.workspace }}\HololensIKEA_TemporaryKey.pfx
          /p:PackageCertificatePassword=ci
          /p:PackageCertificateThumbprint=""

      - name: Locate sideload .msix
        id: locate_appx
        shell: pwsh
        run: |
          $appx = Get-ChildItem -Path "${{ github.workspace }}\AppPackages" `
            -Recurse -Filter "*.msix" `
            | Where-Object {
              $_.Name -like "HololensIKEA_*.msix" -and
              $_.Name -notlike "*Bundle*" -and
              $_.FullName -notmatch "\\Dependencies\\"
            } `
            | Sort-Object LastWriteTime -Descending `
            | Select-Object -First 1

          if (-not $appx) {
            throw "No sideload .msix package found in AppPackages/."
          }

          $packageDir = $appx.DirectoryName
          "appx_path=$($appx.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "appx_name=$($appx.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "package_dir=$packageDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Remove the cert from the workspace before the artifact is captured
      - name: Remove signing certificate
        if: always()
        run: Remove-Item -Path "${{ github.workspace }}\HololensIKEA_TemporaryKey.pfx" -ErrorAction SilentlyContinue

      - name: Upload sideload appx artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: HololensIKEA-${{ github.sha }}-Release-x86
          path: |
            ${{ steps.locate_appx.outputs.appx_path }}
            ${{ steps.locate_appx.outputs.package_dir }}/Dependencies/**
            ${{ steps.locate_appx.outputs.package_dir }}/Install.ps1
            ${{ steps.locate_appx.outputs.package_dir }}/Add-AppDevPackage.ps1
            ${{ steps.locate_appx.outputs.package_dir }}/*.cer
          if-no-files-found: error

      # Commit version bump (only after a successful submit)
      # Commit Package.appxmanifest back to master so the repo always matches
      # the last submitted version and the next run increments above it.
      - name: Commit version bump
        if: github.event.inputs.action == 'submit'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.appxmanifest
          git commit -m "chore: bump version to $env:NEXT_VERSION for release [skip ci]" -q
          git push origin HEAD:${{ github.ref_name }}
          Write-Host "Committed and pushed Package.appxmanifest (v$env:NEXT_VERSION)"

      # Create GitHub release (only after a successful submit)
      - name: Create GitHub release
        if: github.event.inputs.action == 'submit'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:NEXT_VERSION"
          $pkgPath = "${{ steps.locate_appx.outputs.appx_path }}"
          $pkgName = "${{ steps.locate_appx.outputs.appx_name }}"
          if (-not $pkgName.EndsWith('.msix')) {
            Write-Error "Expected .msix package for sideload release, got '$pkgName'."
          }

          $title = "HololensIKEA $tag"
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$pkgName"
          $notes = @(
            "Sideload package release for HoloLens.",
            "",
            "Direct .msix download: [$pkgName]($downloadUrl)",
            "",
            "Package version: $env:NEXT_VERSION"
          ) -join "`n"

          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Updating asset and description."
            gh release upload $tag "$pkgPath" --clobber
            gh release edit $tag --title $title --notes $notes
          } else {
            Write-Host "Creating release $tag with package: $pkgName"
            $bumpSha = git rev-parse HEAD
            gh release create $tag `
              --title $title `
              --notes $notes `
              --target $bumpSha `
              "$pkgPath"
          }

          Write-Host "Release ready: https://github.com/turbolego/HololensIKEA/releases/tag/$tag"
