name: Sideload Release
on:
  push:
    tags:
      - "v*.*.*.0"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.0.1.0)"
        required: false

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve next available release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $requestedTag = "${{ github.ref_name }}"
          $explicitTag = $false
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and
              -not [string]::IsNullOrWhiteSpace("${{ github.event.inputs.tag }}")) {
            $requestedTag = "${{ github.event.inputs.tag }}"
            $explicitTag = $true
          } elseif ("${{ github.event_name }}" -eq "push") {
            $explicitTag = $true
          }

          if ($explicitTag) {
            if ($requestedTag -notmatch '^v\d+\.\d+\.\d+\.0$') {
              throw "Release tag '$requestedTag' is invalid. Expected format: vMajor.Minor.Build.0."
            }
            $requested = [Version]$requestedTag.Substring(1)
            $candidateBuild = $requested.Build
          } else {
            # A manual run without a tag uses the manifest as its base and
            # starts at the next Build component, so ref_name=main is valid.
            $manifest = [xml](Get-Content "${{ github.workspace }}\Package.appxmanifest")
            $requested = [Version]$manifest.Package.Identity.Version
            if ($requested.Revision -ne 0) {
              throw "Manifest version '$requested' is invalid. The revision must be 0."
            }
            $candidateBuild = $requested.Build + 1
            Write-Host "No tag supplied; using manifest version $requested as the base."
          }
          $usedTags = @{}
          $remoteTags = git ls-remote --tags origin "refs/tags/v*" |
            ForEach-Object { ($_ -split "`t")[-1] -replace '^refs/tags/', '' -replace '\^\{\}$', '' }
          foreach ($existingTag in $remoteTags) {
            if ($existingTag -match '^v\d+\.\d+\.\d+\.0$') { $usedTags[$existingTag] = $true }
          }
          $releaseTags = gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' 2>$null
          foreach ($existingTag in $releaseTags) {
            if ($existingTag -match '^v\d+\.\d+\.\d+\.0$') { $usedTags[$existingTag] = $true }
          }

          do {
            $tag = "v{0}.{1}.{2}.0" -f $requested.Major, $requested.Minor, $candidateBuild
            $candidateBuild++
          } while ($usedTags.ContainsKey($tag))

          $version = $tag.Substring(1)
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Selected next available release tag: $tag"

      - name: Set and validate manifest version
        shell: pwsh
        run: |
          $manifestPath = "${{ github.workspace }}\Package.appxmanifest"
          $manifest = [xml](Get-Content $manifestPath)
          $version = [Version]$env:RELEASE_VERSION
          if ($version.Revision -ne 0) {
            throw "Selected version '$version' is invalid. The revision must be 0."
          }
          $manifest.Package.Identity.Version = $env:RELEASE_VERSION
          $manifest.Save($manifestPath)
          $saved = [xml](Get-Content $manifestPath)
          if ($saved.Package.Identity.Version -ne $env:RELEASE_VERSION) {
            throw "Package.appxmanifest version was not updated to '$env:RELEASE_VERSION'."
          }
          Write-Host "Using Store-compatible manifest version: $env:RELEASE_VERSION"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: NuGet restore
        run: nuget restore HololensIKEA.csproj

      - name: Install Windows 10 SDK 19041 and UWP MSBuild tools
        shell: pwsh
        run: |
          $vswhere   = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath    = & $vswhere -latest -products * -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify `
            --installPath "$vsPath" `
            --add Microsoft.VisualStudio.Component.Windows10SDK.19041 `
            --add Microsoft.VisualStudio.ComponentGroup.UWP.MSBuild `
            --quiet --norestart --force
          if ($LASTEXITCODE -notin @(0, 3010)) { exit $LASTEXITCODE }

      - name: Build UWP x86 Draco decoder
        shell: pwsh
        run: .\.github\scripts\build-draco-uwp.ps1

      - name: Create signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=BB1A7F2A-A87C-44C8-8C14-84C6486E7E75" `
            -KeyUsage DigitalSignature `
            -FriendlyName "HololensIKEA" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")

          $pwd = ConvertTo-SecureString -String "ci" -Force -AsPlainText
          $pfxPath = "${{ github.workspace }}\HololensIKEA_TemporaryKey.pfx"
          $cerPath = "${{ github.workspace }}\HololensIKEA_TemporaryKey.cer"

          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

          "PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CER_PATH=$cerPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build signed appx package (Release x86)
        run: >
          msbuild HololensIKEA.csproj
          /t:Publish
          /p:Configuration=Release
          /p:Platform=x86
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxPackageDir=AppPackages\
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile=${{ github.workspace }}\HololensIKEA_TemporaryKey.pfx
          /p:PackageCertificatePassword=ci
          /p:PackageCertificateThumbprint=""

      - name: Normalize package extensions
        shell: pwsh
        run: |
          # Current Windows SDKs emit MSIX extensions even for this UWP
          # package. AppX and MSIX use the same package container; expose the
          # sideload payload with the .appx extension used by the release.
          $msix = Get-ChildItem -Path "${{ github.workspace }}\AppPackages" `
            -Recurse -Filter "HololensIKEA_*.msix" |
            Where-Object {
              $_.Name -notlike "*Bundle*" -and
              $_.FullName -notmatch "\\Dependencies\\"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msix) {
            throw "No standalone MSIX package was emitted by the build."
          }
          $appxPath = [System.IO.Path]::ChangeExtension($msix.FullName, ".appx")
          Copy-Item -Path $msix.FullName -Destination $appxPath -Force
          Write-Host "Normalized release package: $($msix.Name) -> $([System.IO.Path]::GetFileName($appxPath))"

      - name: Collect release assets
        id: collect_assets
        shell: pwsh
        run: |
          $appx = Get-ChildItem -Path "${{ github.workspace }}\\AppPackages" `
                      -Recurse -Filter "*.appx" `
                      | Where-Object {
                        $_.Name -like "HololensIKEA_*.appx" -and
                        $_.Name -notlike "*Bundle*" -and
                        $_.FullName -notmatch "\\Dependencies\\"
                      } `
                      | Sort-Object LastWriteTime -Descending `
                      | Select-Object -First 1

          if (-not $appx) {
            throw "No standalone .appx package found in AppPackages/."
          }

          $packageDir = $appx.DirectoryName
          $zipPath = Join-Path "${{ github.workspace }}" "HololensIKEA_$($env:RELEASE_VERSION)_x86_sideload_bundle.zip"

          # Always include the sideloadable app package itself.
          $items = @($appx.FullName)

          # Include dependency packages if the build emitted them.
          $depDir = Join-Path $packageDir "Dependencies"
          if (Test-Path $depDir) {
            $unsupportedVclibs = @(
              "Microsoft.VCLibs.x64.14.00.appx",
              "Microsoft.VCLibs.ARM64.14.00.appx",
              "Microsoft.VCLibs.ARM.14.00.appx"
            )
            $items += (Get-ChildItem -Path $depDir -Recurse -File |
              Where-Object {
                $_.Extension -eq ".appx" -and
                $_.Name -notin $unsupportedVclibs
              } |
              ForEach-Object { $_.FullName })
          }

          # Include generated install scripts when available.
          $installScript = Join-Path $packageDir "Install.ps1"
          if (Test-Path $installScript) { $items += $installScript }

          $addScript = Join-Path $packageDir "Add-AppDevPackage.ps1"
          if (Test-Path $addScript) { $items += $addScript }

          # Include certificate from package folder if present, otherwise use
          # the certificate generated earlier in this workflow.
          $cerInPackage = Get-ChildItem -Path $packageDir -Filter "*.cer" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cerInPackage) {
            $items += $cerInPackage.FullName
          } elseif (Test-Path "${{ github.workspace }}\HololensIKEA_TemporaryKey.cer") {
            $items += "${{ github.workspace }}\HololensIKEA_TemporaryKey.cer"
          }

          # Some UWP outputs do not emit install scripts; generate a simple
          # fallback script so the sideload bundle remains deployable.
          if (-not (Test-Path $installScript)) {
            $installScript = Join-Path "${{ github.workspace }}" "Install.ps1"
            Set-Content -Path $installScript -Value "Add-AppxPackage -Path `"$($appx.FullName)`""
            $items += $installScript
          }

          # Keep zip input deterministic and avoid duplicate entries.
          $items = $items | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          if ($items.Count -gt 0) {
            Compress-Archive -Path $items -DestinationPath $zipPath -Force
          } else {
            throw "No files found to bundle for sideloading."
          }

          "appx_path=$($appx.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "appx_name=$($appx.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "package_dir=$packageDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $sp = $zipPath.Replace('\', '/')
          "sideload_zip=$sp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload sideload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HololensIKEA-sideload-x86
          path: |
            ${{ steps.collect_assets.outputs.appx_path }}
            ${{ steps.collect_assets.outputs.sideload_zip }}
            ${{ github.workspace }}/HololensIKEA_TemporaryKey.cer
          if-no-files-found: error

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "$env:RELEASE_TAG"
          $title = "HololensIKEA $tag"
          $packageDir = "${{ steps.collect_assets.outputs.package_dir }}"
          $bundleZip = "${{ steps.collect_assets.outputs.sideload_zip }}"
          $cerPath = "${{ github.workspace }}\HololensIKEA_TemporaryKey.cer"
          $appxFiles = @(Get-ChildItem -Path $packageDir -Recurse -Filter "*.appx" |
            Where-Object {
              $_.FullName -notmatch "\\TelemetryDependencies\\" -and
              $_.Name -notin @(
                "Microsoft.VCLibs.x64.14.00.appx",
                "Microsoft.VCLibs.ARM64.14.00.appx",
                "Microsoft.VCLibs.ARM.14.00.appx"
              )
            } |
            Group-Object Name |
            ForEach-Object {
              $x86 = $_.Group | Where-Object { $_.FullName -match "\\x86\\" } | Select-Object -First 1
              if ($x86) { $x86 } else { $_.Group | Select-Object -First 1 }
            } |
            Sort-Object Name)
          if ($appxFiles.Count -eq 0) {
            throw "No AppX files found for direct release links."
          }

          $releaseAssets = @($appxFiles | ForEach-Object { $_.FullName }) + $bundleZip + $cerPath
          $noteLines = @(
            "Sideload package release for HoloLens.",
            "",
            "Direct .appx downloads (HoloLens Edge cannot browse workflow artifacts):"
          )
          foreach ($file in $appxFiles) {
            $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$($file.Name)"
            $noteLines += "- [$($file.Name)]($downloadUrl)"
          }
          $noteLines += ""
          $noteLines += "Includes a sideload bundle zip with dependencies and install scripts."
          $noteLines += "Package version: $env:RELEASE_VERSION"
          $notes = $noteLines -join "`n"

          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Updating assets and notes."
            gh release upload $tag @releaseAssets --clobber
            gh release edit $tag --title $title --notes $notes
          } else {
            Write-Host "Creating release $tag with $($appxFiles.Count) direct AppX assets"
            gh release create $tag `
              --title $title `
              --notes $notes `
              --target "${{ github.sha }}" `
              @releaseAssets
          }

      - name: Remove signing certificate files
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PFX_PATH)) {
            Remove-Item -Path $env:PFX_PATH -Force -ErrorAction SilentlyContinue
          }
          if (-not [string]::IsNullOrWhiteSpace($env:CER_PATH)) {
            Remove-Item -Path $env:CER_PATH -Force -ErrorAction SilentlyContinue
          }
